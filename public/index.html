<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Karaoke Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 900px; }
    .player-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .player-box iframe, .player-box div#player { position: absolute; top:0; left: 0; width: 100%; height: 100%; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #00adb5; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #008f95; }
    .list-title { margin-bottom: 10px; color: #aaa; }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-card { display: flex; align-items: center; background: #1f1f1f; padding: 10px; border-radius: 8px; gap: 15px; cursor: pointer; }
    .song-card:hover { background: #2a2a2a; }
    .song-card img { width: 100px; height: 60px; object-fit: cover; border-radius: 6px; }
    .song-info { flex: 1; }
    .song-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .song-meta { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-box">
      <div id="player"></div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเพลงหรือศิลปิน...">
      <button id="searchBtn">ค้นหาเพลง</button>
    </div>

    <h3 class="list-title">ผลการค้นหา</h3>
    <div class="song-list" id="resultsList"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
